<div class="manual-layout">
  <div class="manual-controls" style="flex: 2;">
    
    <div class="control-group" style="display: flex; gap: 10px; margin-bottom: 20px;">
      <select id="custom-pattern-select" style="flex: 1;">
        <option value="">-- Select Saved Pattern --</option>
      </select>
      <input type="text" id="custom-pattern-name" placeholder="Pattern Name" style="flex: 1;">
      <button class="btn btn-sm" id="custom-btn-save">Save</button>
    </div>

    <div style="background: #1e1e2e; border: 1px solid #333; border-radius: 8px; padding: 10px; margin-bottom: 20px;">
      <canvas id="custom-canvas" width="600" height="200" style="width: 100%; height: 200px; display: block;"></canvas>
    </div>

    <div id="custom-points-list" style="max-height: 250px; overflow-y: auto; margin-bottom: 15px;">
      </div>
    
    <button class="btn btn-sm" id="custom-btn-add">+ Add Point</button>

    <hr style="border-color: #333; margin: 20px 0;">

    <div class="manual-actions">
      <button class="btn btn-primary" id="custom-btn-start">Start Custom Sequence</button>
      <button class="btn btn-ghost" id="custom-btn-stop">Stop</button>
    </div>
  </div>

  <div class="manual-device-panel" style="flex: 1;">
    {% include 'block_device_gauge.html' %}
  </div>
</div>
