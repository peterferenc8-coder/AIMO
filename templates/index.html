<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OSSM Controller</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<base target="_blank">
</head>
<body>

  <header>
    <h1>⬡ OSSM Controller</h1>
    <div class="header-right">
      <div class="health-group">
        <span id="health-dot" class="dot"></span>
        <span id="health-label">Checking…</span>
      </div>
      <button class="btn btn-danger" id="btn-global-stop" title="Emergency Stop">STOP</button>
    </div>
  </header>

  <div id="error-banner">
    <span id="error-banner-msg"></span>
    <button id="error-banner-close" type="button" aria-label="Dismiss">✕</button>
  </div>

  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="setup" id="tab-btn-setup">1. Setup</button>
    <button class="tab-btn" data-tab="manual" id="tab-btn-manual" disabled>2. Manual</button>
    <button class="tab-btn" data-tab="ai" id="tab-btn-ai" disabled>3. AI Session</button>
    <button class="tab-btn" data-tab="custom" id="tab-btn-custom" disabled>4. Custom Patterns</button>
    <button class="tab-btn" data-tab="funscript" id="tab-btn-funscript" disabled>5. Funscript</button>
    <button class="tab-btn" data-tab="settings" id="tab-btn-settings">6. Settings</button>
  </nav>

  <main class="tab-content">
    <section id="tab-setup" class="tab-pane active">
      {% include 'tab_setup.html' %}
    </section>
    <section id="tab-manual" class="tab-pane">
      {% include 'tab_manual.html' %}
    </section>
    <section id="tab-ai" class="tab-pane">
      {% include 'tab_ai.html' %}
    </section>
    <section id="tab-custom" class="tab-pane">
      {% include 'tab_custom.html' %}
    </section>
    <section id="tab-funscript" class="tab-pane">
      {% include 'tab_funscript.html' %}
    </section>
    <section id="tab-settings" class="tab-pane">
      {% include 'tab_settings.html' %}
    </section>
  </main>

  <!-- three.js + three-vrm for the speaking avatar. The importmap must come
       before any module script, and there can be only one per document. -->
  <script type="importmap">
  {
    "imports": {
      "three": "{{ url_for('static', filename='vendor/three/three.module.js') }}",
      "three/addons/": "{{ url_for('static', filename='vendor/three/addons/') }}",
      "@pixiv/three-vrm": "{{ url_for('static', filename='vendor/three-vrm/three-vrm.module.js') }}"
    }
  }
  </script>
  <script type="module" src="{{ url_for('static', filename='js/avatar.js') }}"></script>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script src="{{ url_for('static', filename='js/setup.js') }}"></script>
  <script src="{{ url_for('static', filename='js/manual.js') }}"></script>
  <script src="{{ url_for('static', filename='js/ai.js') }}"></script>
  <script src="{{ url_for('static', filename='js/custom.js') }}"></script>
  <script src="{{ url_for('static', filename='js/funscript.js') }}"></script>
  <script src="{{ url_for('static', filename='js/settings.js') }}"></script>
</body>
</html>
